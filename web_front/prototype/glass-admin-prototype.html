<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试教练 - 后台原型（炭黑高级实心版）</title>
<style>
  /* ===== 设计令牌（炭黑 + 翡翠青 · 实心层次 · 无线毛玻璃） ===== */
  :root {
    --brand: #D9A441;
    --bg: #0B0B0C;            /* 纯中性炭黑（RGB 相等，零色相） */
    --surface: #141416;       /* 卡片基面（中性灰，无冷暖偏色） */
    --surface-2: #101012;     /* 卡片次级/列表行 */
    --surface-hover: #1C1C1F;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --text-1: #E9E9EB;
    --text-2: rgba(233,233,235,0.6);
    --text-3: rgba(233,233,235,0.36);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.25);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body.light {
    --bg: #F0EFEC;
    --surface: #FFFFFF;
    --surface-2: #F6F5F2;
    --surface-hover: #FAF9F6;
    --border: rgba(20,25,26,0.08);
    --border-strong: rgba(20,25,26,0.14);
    --text-1: #232427;
    --text-2: rgba(35,36,39,0.62);
    --text-3: rgba(35,36,39,0.4);
    --shadow: 0 1px 2px rgba(20,25,26,0.04), 0 10px 28px rgba(20,25,26,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    color: var(--text-1);
    overflow: hidden;
    height: 100vh;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; height: 100vh; }
  .brand {
    width: 26px; height: 26px; border-radius: 8px;
    background: #D9A441; color: #0B0B0C;
    display: grid; place-items: center;
  }
  .brand svg { width: 15px; height: 15px; }

  /* ===== 侧边栏（实心） ===== */
  .sidebar {
    width: 232px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .sb-logo {
    height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 0 18px; cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .sb-logo .name { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
  .sb-nav { flex: 1; padding: 12px; overflow-y: auto; }
  .sb-label { font-size: 10px; letter-spacing: 1.6px; color: var(--text-3); padding: 4px 10px 10px; }
  .sb-item {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin-bottom: 4px; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-2); font-size: 13.5px; font-weight: 500;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sb-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
  .sb-item:hover { background: var(--surface-hover); color: var(--text-1); }
  .sb-item.active {
    background: rgba(217,164,65,0.12);
    color: var(--text-1);
    box-shadow: inset 0 0 0 1px rgba(217,164,65,0.35);
  }
  .sb-item.active svg { opacity: 1; color: #D9A441; }
  .sb-foot { padding: 12px; border-top: 1px solid var(--border); }
  .sb-item.logout:hover { color: #E07A6A; background: rgba(224,122,106,0.08); }

  /* ===== 主区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .hello { font-size: 13.5px; color: var(--text-2); }
  .topbar .hello b { color: var(--text-1); font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .theme-switch {
    height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
    border-radius: 999px; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer;
    font-family: inherit; transition: background 0.15s ease;
  }
  .theme-switch:hover { background: var(--surface-hover); color: var(--text-1); }
  .icon-btn {
    position: relative; width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: transparent;
    display: grid; place-items: center; color: var(--text-1); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { border-color: rgba(217,164,65,0.5); color: #D9A441; background: rgba(217,164,65,0.08); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: #D9A441; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: #D9A441; color: #0B0B0C;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
  }
  body.light .avatar { box-shadow: 0 0 0 2px rgba(255,255,255,0.9); }

  .content { flex: 1; overflow-y: auto; padding: 22px; }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  body.light .content::-webkit-scrollbar-thumb { background: rgba(27,33,31,0.18); }

  /* ===== 卡片基元（实心 + 细分隔） ===== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .card-pad { padding: 20px 22px; }

  /* ===== 工作台 ===== */
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
  .page-head p { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .row-a { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 14px; }

  .banner { padding: 26px 28px; min-height: 158px; display: flex; flex-direction: column; justify-content: center; }
  .banner h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .banner p { font-size: 13px; color: var(--text-2); max-width: 360px; margin-bottom: 18px; line-height: 1.6; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: var(--radius-sm); border: none;
    background: #D9A441; color: #0B0B0C;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn-primary:hover { background: #E6AF4E; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary svg { width: 15px; height: 15px; }

  .stat-title { font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 14px; letter-spacing: 0.3px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-item { text-align: left; }
  .stat-num { font-size: 21px; font-weight: 800; color: #D9A441; line-height: 1; margin-bottom: 4px; }
  .stat-item.dark .stat-num { color: var(--text-1); }
  .stat-label { font-size: 11px; color: var(--text-3); }
  .checkin-btn {
    width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none;
    background: #D9A441; color: #0B0B0C;
    font-family: inherit; font-weight: 700; cursor: pointer; text-align: center;
    transition: background 0.15s ease;
  }
  .checkin-btn:hover { background: #E6AF4E; }
  .checkin-num { font-size: 17px; font-weight: 800; }
  .checkin-label { font-size: 10.5px; opacity: 0.8; margin-top: 2px; }
  .checkin-btn.done { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); cursor: default; }
  .checkin-btn.done:hover { background: var(--surface-2); }
  body.light .checkin-btn.done { background: #F2F0EA; }

  .sec-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; margin: 22px 0 12px; }
  .sec-title svg { width: 17px; height: 17px; color: #D9A441; }
  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .quick-card { padding: 16px; border-radius: var(--radius-md); text-align: left; cursor: pointer; transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease; }
  .quick-card:hover { transform: translateY(-2px); border-color: rgba(217,164,65,0.4); background: var(--surface-hover); }
  .quick-icon {
    width: 38px; height: 38px; border-radius: 12px; margin-bottom: 12px;
    display: grid; place-items: center; color: #D9A441;
    background: rgba(217,164,65,0.12);
  }
  .quick-icon svg { width: 18px; height: 18px; }
  .quick-card h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
  .quick-card p { font-size: 11.5px; color: var(--text-3); }

  .list-card { padding: 6px; border-radius: var(--radius-md); }
  .list-item {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: background 0.15s ease;
  }
  .list-item:hover { background: var(--surface-2); }
  .score {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 15px; font-weight: 800;
  }
  .list-meta { flex: 1; min-width: 0; }
  .list-meta .row { display: flex; align-items: center; gap: 8px; }
  .list-meta h4 { font-size: 13.5px; font-weight: 600; }
  .chip { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: rgba(217,164,65,0.12); color: #D9A441; }
  body.light .chip { color: #A97E24; }
  .chip.warn { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
  .list-meta .sub { font-size: 11.5px; color: var(--text-3); margin-top: 5px; display: flex; gap: 14px; }
  .list-arrow { color: var(--text-3); }
  .list-arrow svg { width: 14px; height: 14px; }

  /* ===== 入场动画（纯位移淡入） ===== */
  [data-reveal] { opacity: 0; transform: translateY(12px); }
  .anim-in [data-reveal] { animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
</style>
</head>

  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    // ===== 主题切换 =====
    document.getElementById('themeSwitch').addEventListener('click', () => {
      document.body.classList.toggle('light');
    });

    // ===== 入场动画（纯位移淡入） =====
    function playEntrance() {
      if (typeof gsap === 'undefined') {
        document.body.classList.add('anim-in');
        document.querySelectorAll('[data-reveal]').forEach((el, i) => {
          el.style.animationDelay = (i * 60) + 'ms';
        });
        return;
      }
      gsap.fromTo('[data-reveal]',
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, stagger: 0.06, ease: 'power2.out', delay: 0.1 }
      );
      gsap.fromTo('.sidebar', { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power2.out' });
      gsap.fromTo('.topbar', { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, delay: 0.06, ease: 'power2.out' });
    }

    window.addEventListener('load', playEntrance);
  </script>
</body>
</html>
