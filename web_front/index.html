<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 驱动的模拟面试练习平台，上传简历智能生成个性化面试题，多维度评分与改进建议。" />
    <link rel="icon" href="data:," />
    <title>AI 超级面试</title>
    <script>
      // 首帧主题初始化：默认炭黑暗色，localStorage 记忆
      (function () {
        var t = null;
        try { t = localStorage.getItem('app_theme'); } catch (e) {}
        var theme = t === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #F6F8FA;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        z-index: 9999;
      }
      html[data-theme='dark'] #app-loading { background: #0B0B0C; }
      #app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #3A3F45;
        border-top-color: #D9A441;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      html[data-theme='light'] #app-loading .spinner {
        border-color: #E1E4E8;
        border-top-color: #D9A441;
      }
      #app-loading .loading-text {
        font-size: 13px;
        color: #8B909A;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 首屏加载骨架：JS 加载期间避免白屏，React 挂载后自动替换 -->
      <div id="app-loading">
        <div class="spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
