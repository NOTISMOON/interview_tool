services:
  # ============================================
  # Backend 实例 1（FastAPI）
  # ============================================
  backend-1:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: interview-backend-1
    restart: unless-stopped
    expose:
      - "8000"
    command: >
      sh -c "pip install alembic -q && (alembic upgrade head 2>/dev/null || alembic stamp head 2>/dev/null) && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    env_file: ./api_server/.env
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_URL=mysql+pymysql://root:123456@host.docker.internal:3306/interview_db
      - MYSQL_ASYNC_URL=mysql+aiomysql://root:123456@host.docker.internal:3306/interview_db
      - REDIS_URL=redis://:123456@host.docker.internal:6379/0
      - RABBITMQ_URL=amqp://admin:admin123@host.docker.internal:5672/
      - COOKIE_DOMAIN=
      - CORS_ORIGINS=["http://localhost:5645","http://localhost:5646","http://localhost:5173","http://xg-2.frp.one:31431","https://aiinterview.notismoon.top","http://aiinterview.notismoon.top"]
      - LLM_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 显式指定公共 DNS，绕开 Docker 内嵌 DNS 转发宿主机的不稳定链路，
    # 避免容器内解析 github.com/gitee.com 出现间歇性 EAI_AGAIN（详见 docs/Debug总结/项目部署踩坑文档.md）
    dns:
      - 223.5.5.5
      - 119.29.29.29

  # ============================================
  # Backend 实例 2（FastAPI）
  # ============================================
  backend-2:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: interview-backend-2
    restart: unless-stopped
    expose:
      - "8000"
    command: >
      sh -c "pip install alembic -q && (alembic upgrade head 2>/dev/null || alembic stamp head 2>/dev/null) && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    env_file: ./api_server/.env
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_URL=mysql+pymysql://root:123456@host.docker.internal:3306/interview_db
      - MYSQL_ASYNC_URL=mysql+aiomysql://root:123456@host.docker.internal:3306/interview_db
      - REDIS_URL=redis://:123456@host.docker.internal:6379/0
      - RABBITMQ_URL=amqp://admin:admin123@host.docker.internal:5672/
      - COOKIE_DOMAIN=
      - CORS_ORIGINS=["http://localhost:5645","http://localhost:5646","http://localhost:5173","http://xg-2.frp.one:31431","https://aiinterview.notismoon.top","http://aiinterview.notismoon.top"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 显式指定公共 DNS，绕开 Docker 内嵌 DNS 转发宿主机的不稳定链路，
    # 避免容器内解析 github.com/gitee.com 出现间歇性 EAI_AGAIN（详见 docs/Debug总结/项目部署踩坑文档.md）
    dns:
      - 223.5.5.5
      - 119.29.29.29

  # ============================================
  # MQ 消费者进程（单实例）
  # ============================================
  mq-consumer:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    container_name: interview-mq-consumer
    restart: unless-stopped
    command: python -m app.mq.runner
    env_file: ./api_server/.env
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_URL=mysql+pymysql://root:123456@host.docker.internal:3306/interview_db
      - MYSQL_ASYNC_URL=mysql+aiomysql://root:123456@host.docker.internal:3306/interview_db
      - REDIS_URL=redis://:123456@host.docker.internal:6379/0
      - RABBITMQ_URL=amqp://admin:admin123@host.docker.internal:5672/
      - COOKIE_DOMAIN=
      - LLM_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # Nginx 负载均衡 + 前端静态文件服务
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: interview-nginx
    restart: unless-stopped
    ports:
        - "5645:5645"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy

  # ============================================
  # 前端构建（产出到 volume，供 nginx 挂载）
  # ============================================
  frontend:
    build:
      context: ./web_front
      dockerfile: Dockerfile
    container_name: interview-frontend
    volumes:
      - frontend_dist:/dist
    restart: "no"

volumes:
  frontend_dist: