worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ========== Gzip 压缩：JS/CSS/JSON 传输体积减 60-70%，显著提速首屏 ==========
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # 后端负载均衡 upstream
    upstream backend_cluster {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=10s;
        server backend-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 5645 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/ssl/aiinterview.notismoon.top_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/aiinterview.notismoon.top.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        server_name aiinterview.notismoon.top localhost xg-2.frp.one;

        client_max_body_size 20M;

        # ========== API 反向代理（负载均衡） ==========
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # ========== WebSocket 反向代理（私信聊天） ==========
        # 私信 WS 端点为 /api/v1/chat/ws（chat router prefix=/chat，端点 /ws）
        location /api/v1/chat/ws {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 兼容旧的 /api/v1/ws 路径（如有历史客户端仍连接）
        location /api/v1/ws {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ========== SSE 推送端点 ==========
        location /api/v1/messages/stream {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # ========== 前端静态文件 ==========
        # index.html 不缓存：每次请求重新校验，确保加载最新构建的 JS/CSS 引用
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ========== 静态资源缓存 ==========
        # 带内容 hash 的构建产物可长期缓存（文件名变则引用变，天然失效）
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}